# Standalone OpenShell SandboxRequest controller.
# Prerequisites:
# - sandboxrequests.apps.carewright.io CRD is installed.
# - OpenShell gateway is reachable at openshell.openshell.svc.cluster.local:8080.
apiVersion: v1
kind: Namespace
metadata:
  name: carewright-operator-system
  labels:
    app.kubernetes.io/name: carewright-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carewright-operator-controller-manager
  namespace: carewright-operator-system
  labels:
    app.kubernetes.io/name: carewright-operator
    app.kubernetes.io/component: openshell-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: carewright-operator-sandboxrequest-controller
  labels:
    app.kubernetes.io/name: carewright-operator
    app.kubernetes.io/component: openshell-controller
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps.carewright.io"]
    resources: ["sandboxrequests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps.carewright.io"]
    resources: ["sandboxrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps.carewright.io"]
    resources: ["sandboxrequests/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: carewright-operator-sandboxrequest-controller
  labels:
    app.kubernetes.io/name: carewright-operator
    app.kubernetes.io/component: openshell-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: carewright-operator-sandboxrequest-controller
subjects:
  - kind: ServiceAccount
    name: carewright-operator-controller-manager
    namespace: carewright-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carewright-operator-openshell-controller
  namespace: carewright-operator-system
  labels:
    app.kubernetes.io/name: carewright-operator
    app.kubernetes.io/component: openshell-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carewright-operator
      app.kubernetes.io/component: openshell-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carewright-operator
        app.kubernetes.io/component: openshell-controller
    spec:
      serviceAccountName: carewright-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: quay.io/carewright/carewright-operator:0d099a7
          imagePullPolicy: IfNotPresent
          args:
            - --controllers=sandboxrequest
            - --health-probe-bind-address=:8081
          env:
            - name: HOME
              value: /tmp
            - name: OPENSHELL_GATEWAY_ENDPOINT
              value: http://openshell.openshell.svc.cluster.local:8080
            - name: OPENSHELL_GATEWAY_INSECURE
              value: "true"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 10
