apiVersion: apps.cpgtoacp.io/v1alpha1
kind: SandboxRequest
metadata:
  name: cpg-assembly
  namespace: default
  labels:
    app.kubernetes.io/name: cpg-ingester-assembly
    app.kubernetes.io/part-of: cpg-ingester
spec:
  sandboxName: cpg-assembly
  gateway:
    endpoint: http://openshell.openshell.svc.cluster.local:8080
    insecure: true
  image: quay.io/cpgtoacp/cpg-ingester-assembly:d7a4b92
  command:
    - uvicorn
    - cpg_ingester.services.assembly_svc:app
    - --host
    - 0.0.0.0
    - --port
    - "8080"
  policyRef:
    name: cpg-assembly-policy
    key: policy.yaml
  env:
    PYTHONPATH: /app/src
  resources:
    cpu: 200m
    memory: 512Mi
  services:
    - name: http
      targetPort: 8080
  labels:
    app.kubernetes.io/component: assembly
    app.kubernetes.io/part-of: cpg-ingester
