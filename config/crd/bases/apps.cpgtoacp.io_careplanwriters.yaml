---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: careplanwriters.apps.cpgtoacp.io
spec:
  group: apps.cpgtoacp.io
  names:
    kind: CarePlanWriter
    listKind: CarePlanWriterList
    plural: careplanwriters
    singular: careplanwriter
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CarePlanWriter is the Schema for the careplanwriters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CarePlanWriterSpec defines the desired state of CarePlanWriter.
            properties:
              aiTransparency:
                description: AITransparency configures prompt provenance, the model
                  card, and the default reviewer.
                properties:
                  capturePrompts:
                    default: true
                    description: |-
                      CapturePrompts emits rendered prompts as FHIR DocumentReferences.
                      Prompts can contain PHI and should be disabled where retention is inappropriate.
                    type: boolean
                  modelCardURL:
                    description: ModelCardURL is recorded as the model-card DocumentReference.
                    type: string
                  reviewer:
                    description: Reviewer configures the default human verifier.
                    properties:
                      display:
                        description: Display is the human-readable reviewer name.
                        type: string
                      identifierSystem:
                        description: IdentifierSystem is the URI of the reviewer's
                          identifier system.
                        type: string
                      identifierValue:
                        description: IdentifierValue is the reviewer identifier in
                          IdentifierSystem.
                        type: string
                      reference:
                        description: Reference is the reviewer FHIR reference, for
                          example Practitioner/123.
                        type: string
                    type: object
                type: object
              artifactStore:
                description: ArtifactStore configures shared artifact and PHI storage.
                properties:
                  artifactBucket:
                    default: cpg-artifacts
                    description: ArtifactBucket contains non-PHI pipeline artifacts.
                    type: string
                  credentialsProvider:
                    description: |-
                      CredentialsProvider is an OpenShell provider that supplies
                      ARTIFACT_STORE_ACCESS_KEY and ARTIFACT_STORE_SECRET_KEY.
                    type: string
                  phiBucket:
                    description: PHIBucket contains artifacts with protected health
                      information.
                    type: string
                  url:
                    description: URL is the artifact store endpoint.
                    type: string
                type: object
              bff:
                description: BFF exposes the backend API used by the Care Plan Writer
                  UI.
                properties:
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                  pythonPath:
                    description: PythonPath is translated to PYTHONPATH.
                    type: string
                required:
                - image
                type: object
              decisionEngine:
                description: DecisionEngine provides the Python-facing wrapper around
                  the Kogito runtime.
                properties:
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                  pythonPath:
                    description: PythonPath is translated to PYTHONPATH.
                    type: string
                required:
                - image
                type: object
              decisionService:
                description: DecisionService runs the Kogito decision service used
                  to evaluate DMN.
                properties:
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                  javaOptions:
                    description: JavaOptions contains additional JVM options.
                    type: string
                required:
                - image
                type: object
              fhirGeneration:
                description: FHIRGeneration generates and reviews FHIR bundles.
                properties:
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                  pythonPath:
                    description: PythonPath is translated to PYTHONPATH.
                    type: string
                required:
                - image
                type: object
              fhirServer:
                description: FHIRServer writes approved care plans to the configured
                  FHIR server.
                properties:
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                  pythonPath:
                    description: PythonPath is translated to PYTHONPATH.
                    type: string
                required:
                - image
                type: object
              fhirTarget:
                description: FHIRTarget configures the target EHR.
                properties:
                  credentialsProvider:
                    description: |-
                      CredentialsProvider is an optional OpenShell provider that supplies
                      FHIR_CLIENT_ID and FHIR_CLIENT_SECRET.
                    type: string
                  url:
                    description: URL is the base FHIR R4 endpoint.
                    type: string
                type: object
              llm:
                description: LLM configures the model endpoint used by reasoning and
                  FHIR generation.
                properties:
                  credentialsProvider:
                    description: CredentialsProvider is an OpenShell provider that
                      supplies LLM_API_KEY.
                    type: string
                  model:
                    default: default
                    description: Model is the model identifier sent to the endpoint.
                    type: string
                  requestTimeoutSeconds:
                    default: 600
                    description: RequestTimeoutSeconds is the maximum duration of
                      an LLM request.
                    format: int32
                    minimum: 1
                    type: integer
                  url:
                    description: URL is the LiteLLM-compatible endpoint.
                    type: string
                type: object
              llmReasoning:
                description: LLMReasoning resolves guidelines, evaluates decisions,
                  and composes plans.
                properties:
                  embedding:
                    description: Embedding configures guideline vector embeddings.
                    properties:
                      credentialsProvider:
                        description: |-
                          CredentialsProvider is an OpenShell provider that supplies EMBEDDING_API_KEY.
                          The LLM credentials provider is used when omitted.
                        type: string
                      model:
                        description: Model is the embedding model identifier.
                        type: string
                      provider:
                        description: Provider selects the embedding implementation,
                          for example openai or local.
                        type: string
                      url:
                        description: URL overrides the embedding API endpoint. The
                          LLM URL is used when omitted.
                        type: string
                    type: object
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                  pythonPath:
                    description: PythonPath is translated to PYTHONPATH.
                    type: string
                required:
                - image
                type: object
              mcp:
                description: MCP exposes the Care Plan Writer tools through the Model
                  Context Protocol.
                properties:
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                  pythonPath:
                    description: PythonPath is translated to PYTHONPATH.
                    type: string
                required:
                - image
                type: object
              observability:
                description: Observability configures shared tracing.
                properties:
                  mlflowTrackingURI:
                    description: MLflowTrackingURI is translated to MLFLOW_TRACKING_URI.
                    type: string
                type: object
              patientData:
                description: PatientData scans and normalizes patient data for the
                  workflow.
                properties:
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                  pythonPath:
                    description: PythonPath is translated to PYTHONPATH.
                    type: string
                required:
                - image
                type: object
              ui:
                description: UI serves the Care Plan Writer web application.
                properties:
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: ExtraEnv contains non-secret environment variables
                      that do not yet have first-class fields.
                    type: object
                  extraProviders:
                    description: |-
                      ExtraProviders attaches additional OpenShell credential providers to this component.
                      Domain-specific providers should be configured on their corresponding integration.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the complete container image reference,
                      including its registry and tag or digest.
                    minLength: 1
                    type: string
                required:
                - image
                type: object
            required:
            - bff
            - decisionEngine
            - decisionService
            - fhirGeneration
            - fhirServer
            - llmReasoning
            - mcp
            - patientData
            - ui
            type: object
          status:
            description: CarePlanWriterStatus defines the observed state of CarePlanWriter.
            properties:
              conditions:
                description: Conditions summarize the current availability and reconciliation
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                additionalProperties:
                  type: string
                description: |-
                  Endpoints contains operator-published addresses for pipeline entry points.
                  Internal component wiring is intentionally not exposed as desired state.
                type: object
              observedGeneration:
                description: ObservedGeneration is the most recent generation reconciled
                  by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
