                  properties:
                    host:
                      description: Host is the DNS name the sandbox may contact.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the policy rule name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      description: Port is the destination TCP port.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      default: rest
                      description: Protocol selects OpenShell's application protocol
                        inspection.
                      enum:
                      - http
                      - https
                      - rest
                      type: string
                  required:
                  - host
                  - name
                  - port
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              policyRef:
                description: PolicyRef selects an OpenShell policy stored in a ConfigMap
                  in this namespace.
                properties:
                  key:
                    description: The key to select.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
