                  optional:
                    description: Specify whether the ConfigMap or its key must be
                      defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              providers:
                description: Providers are OpenShell provider names used to inject
                  credentials securely.
                items:
                  type: string
                type: array
              resources:
                description: Resources requests CPU, memory, and GPU resources for
                  the sandbox.
                properties:
                  cpu:
                    description: CPU is an OpenShell CPU quantity, for example "500m"
                      or "2".
                    type: string
                  gpu:
                    description: GPU is the number of GPUs requested by the sandbox.
                    format: int32
                    minimum: 0
                    type: integer
                  memory:
                    description: Memory is an OpenShell memory quantity, for example
                      "512Mi" or "2Gi".
                    type: string
                type: object
              sandboxName:
                description: SandboxName overrides the OpenShell sandbox name. It
                  defaults to metadata.name.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              services:
                description: |-
                  Services are HTTP endpoints the OpenShell gateway should expose from the sandbox.
                  Changing only this field does not recreate the sandbox.
                items:
                  description: SandboxServiceSpec exposes an HTTP service running
                    inside the sandbox.
                  properties:
                    name:
                      description: Name identifies the service within the sandbox.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    targetPort:
                      description: TargetPort is the TCP port on which the sandbox
                        process listens.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - name
                  - targetPort
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              workspace:
                default: default
                description: Workspace is the OpenShell workspace containing the sandbox.
                type: string
            required:
            - image
            type: object
            x-kubernetes-validations:
            - message: gateway.name and gateway.endpoint are mutually exclusive
              rule: '!has(self.gateway) || !(has(self.gateway.name) && has(self.gateway.endpoint))'
          status:
            description: SandboxRequestStatus defines the observed OpenShell sandbox
              state.
            properties:
              conditions:
                description: Conditions describe whether the sandbox is available
                  or reconciliation failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gateway:
                description: Gateway is the gateway location where the observed sandbox
                  was created.
                properties:
                  endpoint:
                    description: Endpoint is the URL of an OpenShell gateway.
                    type: string
                  insecure:
                    description: Insecure permits plaintext HTTP or skips certificate
                      verification for HTTPS.
                    type: boolean
                  name:
                    description: |-
                      Name is retained for compatibility with CLI-based controllers. SDK-based
                      controllers require Endpoint instead.
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the most recent generation processed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the state reported by OpenShell.
                type: string
              sandboxID:
                description: SandboxID is the identifier reported by OpenShell.
                type: string
              sandboxName:
                description: SandboxName is the effective OpenShell sandbox name.
                type: string
              services:
                description: Services contains gateway-generated endpoints for the
                  requested services.
                items:
                  description: SandboxServiceStatus reports an HTTP endpoint generated
                    by the OpenShell gateway.
                  properties:
                    id:
                      description: ID is the endpoint identifier reported by OpenShell.
                      type: string
                    name:
                      description: Name identifies the service from spec.services.
                      type: string
                    targetPort:
                      description: TargetPort is the TCP port exposed in the sandbox.
                      format: int32
                      type: integer
                    url:
                      description: URL is the gateway-generated URL for the service.
                      type: string
                  required:
                  - name
                  - targetPort
                  type: object
                type: array
                x-kubernetes-list-map-keys:
