---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: sandboxrequests.apps.carewright.io
spec:
  group: apps.carewright.io
  names:
    kind: SandboxRequest
    listKind: SandboxRequestList
    plural: sandboxrequests
    singular: sandboxrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.sandboxName
      name: Sandbox
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SandboxRequest is the Schema for the sandboxrequests API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SandboxRequestSpec defines an OpenShell sandbox and the process it should run.
              The environment map is intended for non-secret values. OpenShell providers should
              be used to make credentials available to the sandbox.
            properties:
              approvalMode:
                description: ApprovalMode controls how OpenShell handles tool approval
                  requests.
                enum:
                - manual
                - auto
                type: string
              command:
                description: Command is the command and arguments executed in the
                  sandbox.
                items:
                  type: string
                type: array
              env:
                additionalProperties:
                  type: string
                description: Env contains non-secret environment variables passed
                  to the sandbox.
                type: object
              gateway:
                description: Gateway selects the OpenShell gateway. The controller's
                  configured endpoint is used when omitted.
                properties:
                  endpoint:
                    description: Endpoint is the URL of an OpenShell gateway.
                    type: string
                  insecure:
                    description: Insecure permits plaintext HTTP or skips certificate
                      verification for HTTPS.
                    type: boolean
                  name:
                    description: |-
                      Name is retained for compatibility with CLI-based controllers. SDK-based
                      controllers require Endpoint instead.
                    type: string
                type: object
              image:
                description: Image is the container image used to create the sandbox.
                minLength: 1
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels are attached to the OpenShell sandbox.
                type: object
              networkAccess:
