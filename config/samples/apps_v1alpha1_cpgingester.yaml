apiVersion: apps.cpgtoacp.io/v1alpha1
kind: CPGIngester
metadata:
  labels:
    app.kubernetes.io/name: cpgtoacp-operator
    app.kubernetes.io/managed-by: kustomize
  name: cpgingester-sample
spec:
  artifactStore:
    url: http://minio:9000
    artifactBucket: cpg-artifacts
    credentialsProvider: minio-credentials
  observability:
    mlflowTrackingURI: http://mlflow:5000
  llm:
    url: http://litellm:4000
    model: default
    credentialsProvider: llm-credentials
    requestTimeoutSeconds: 600
  carePlanWriterRef:
    name: careplanwriter-sample
  ingestion:
    image: quay.io/cpgtoacp/cpg-ingester-ingestion:latest
    logLevel: DEBUG
    doclingLogLevel: DEBUG
    pythonUnbuffered: true
    doclingCacheDirectory: /app/.cache/docling
    doclingArtifactsPath: /app/.cache/docling/models
    huggingFaceTransferEnabled: false
    huggingFaceOffline: true
    ocrEnabled: true
  llmAnalysis:
    image: quay.io/cpgtoacp/cpg-ingester-llm:latest
    pythonPath: /app/src
    figureInterpretationEnabled: true
    figureInterpretationMaxFigures: 100
  assembly:
    image: quay.io/cpgtoacp/cpg-ingester-assembly:latest
    pythonPath: /app/src
  delivery:
    image: quay.io/cpgtoacp/cpg-ingester-delivery:latest
    pythonPath: /app/src
  bff:
    image: quay.io/cpgtoacp/cpg-ingester-bff:latest
    pythonPath: /app/src
  ui:
    image: quay.io/cpgtoacp/cpg-ingester-ui:latest
