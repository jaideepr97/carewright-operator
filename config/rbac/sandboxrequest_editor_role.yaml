# This rule is not used by the project carewright-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.carewright.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: carewright-operator
    app.kubernetes.io/managed-by: kustomize
  name: sandboxrequest-editor-role
rules:
- apiGroups:
  - apps.carewright.io
  resources:
  - sandboxrequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.carewright.io
  resources:
  - sandboxrequests/status
  verbs:
  - get
