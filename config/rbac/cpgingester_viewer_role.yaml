# This rule is not used by the project cpgtoacp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to apps.cpgtoacp.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cpgtoacp-operator
    app.kubernetes.io/managed-by: kustomize
  name: cpgingester-viewer-role
rules:
- apiGroups:
  - apps.cpgtoacp.io
  resources:
  - cpgingesters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.cpgtoacp.io
  resources:
  - cpgingesters/status
  verbs:
  - get
